# Dedicated presentation subdomain.
server {
    listen 80;
    server_name plan.bcmty.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/course-plans/acme;
        default_type text/plain;
    }

    location / { return 301 https://plan.bcmty.cn$request_uri; }
}

server {
    listen 443 ssl;
    server_name plan.bcmty.cn;
    ssl_certificate /etc/letsencrypt/live/plan.bcmty.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plan.bcmty.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Only publish the five presentations and the assets they need.
    location ~ ^/course-plan/(yucai-rocket|yucai-preschool|kete-moon|kete-python|yingcai-python)/?$ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /_next/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /images/course-plan/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
